{{ define "main" }}
<style>
  .lab-hero {
    background: linear-gradient(135deg, #1a3a5c 0%, #2563eb 100%);
    border-radius: 14px;
    padding: 2.5rem 2rem;
    text-align: center;
    margin-bottom: 2rem;
    color: #fff;
  }
  .lab-hero .lab-acronym {
    font-size: .82rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    opacity: .78;
    margin-bottom: .6rem;
  }
  .lab-hero h2 {
    font-size: 1.9rem;
    font-weight: 800;
    margin: 0 0 .5rem;
    color: #fff;
    border: none;
  }
  .lab-hero p {
    font-size: .97rem;
    opacity: .88;
    max-width: 580px;
    margin: 0 auto;
    line-height: 1.6;
    color: #fff;
  }

  /* Style the rendered markdown content */
  .lab-content h2 {
    font-size: 1.15rem;
    font-weight: 700;
    margin: 2rem 0 .75rem;
    padding-left: .7rem;
    border-left: 4px solid #2563eb;
    color: #1a3a5c;
  }
  .dark .lab-content h2 { color: #93c5fd; }

  .lab-content h3 {
    font-size: .95rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #64748b;
    margin: 1.2rem 0 .5rem;
    padding-bottom: .25rem;
    border-bottom: 1px solid #e2e8f0;
  }
  .dark .lab-content h3 { color: #94a3b8; border-bottom-color: #334155; }

  .lab-content ul {
    list-style: none;
    padding: 0;
    margin: 0 0 .5rem;
  }
  .lab-content ul li {
    padding: .35rem 0;
    border-bottom: 1px solid #f1f5f9;
    font-size: .93rem;
    display: flex;
    align-items: baseline;
    gap: .4rem;
  }
  .dark .lab-content ul li { border-bottom-color: #1e293b; }
  .lab-content ul li::before {
    content: '›';
    color: #2563eb;
    font-weight: 700;
    flex-shrink: 0;
  }
  .lab-content ul li:last-child { border-bottom: none; }
  .lab-content a {
    color: #2563eb;
    font-weight: 600;
    text-decoration: none;
  }
  .lab-content a:hover { text-decoration: underline; }

  .lab-content p {
    font-size: .95rem;
    line-height: 1.7;
    margin-bottom: 1rem;
  }
  .lab-content hr {
    border: none;
    border-top: 1px solid #e2e8f0;
    margin: 1.5rem 0;
  }
  .dark .lab-content hr { border-top-color: #334155; }
</style>

<div class="lab-hero">
  <div class="lab-acronym">D &middot; I &middot; S &middot; C &middot; O &middot; V &middot; E &middot; R</div>
  <h2>DISCOVER Lab @ NITK</h2>
  <p><strong style="color:#fff">Distributed Computing and Vision Intelligence Research Lab</strong><br>
  Department of Computer Science &amp; Engineering &mdash; NIT Karnataka, Surathkal</p>
</div>

<div class="lab-content">
  {{ .Content }}
</div>

{{ end }}
